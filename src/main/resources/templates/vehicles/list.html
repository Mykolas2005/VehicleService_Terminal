<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vehicles Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Vehicle Service Management</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:if="${session.loggedInUser?.role?.toString() == 'ADMIN'}" href="/admin/dashboard">Admin Dashboard</a>
                <a class="nav-link" href="/tickets">Tickets</a>
                <!-- The Vehicles link is set to active here -->
                <a class="nav-link active" th:if="${session.loggedInUser?.role?.toString() != 'CUSTOMER'}" href="/vehicles">Vehicles</a>
                <a class="nav-link text-danger" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Registered Vehicles</h2>
            <a href="/vehicles/register" class="btn btn-primary">Register New Vehicle</a>
        </div>

        <!-- Search Form adapted for Vehicles -->
        <form method="get" action="/vehicles" class="row g-3 mb-4 bg-white p-3 rounded shadow-sm">
            <div class="col-md-9">
                <label for="search" class="form-label small fw-bold">Search (Registration Number)</label>
                <!-- Note: To make this search functional, we would need to add a @RequestParam to VehicleController later -->
                <input type="text" class="form-control" id="search" name="search" placeholder="e.g. ABC-123">
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100 me-2">Search</button>
                <a href="/vehicles" class="btn btn-outline-secondary w-100">Reset</a>
            </div>
        </form>

        <!-- Safe null/empty check for vehicles -->
        <div th:if="${#lists.isEmpty(vehicles)}" class="alert alert-info">
            No vehicles found matching your criteria.
        </div>

        <!-- Display table when vehicles are present -->
        <div th:unless="${#lists.isEmpty(vehicles)}" class="table-responsive">
            <table class="table table-bordered table-striped bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Make & Model</th>
                        <th>Registration Number</th>
                        <th th:if="${session.loggedInUser?.role?.toString() != 'CUSTOMER'}">Owner</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="vehicle : ${vehicles}">
                        <td th:text="${vehicle.id}">1</td>
                        <td th:text="${vehicle.make + ' ' + vehicle.model}">Make Model</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${vehicle.registrationNumber}">ABC-123</span>
                        </td>
                        <td th:if="${session.loggedInUser?.role?.toString() != 'CUSTOMER'}" 
                            th:text="${vehicle.owner != null ? vehicle.owner.username : 'N/A'}">Owner</td>
                        <td>
                            <!-- Easy shortcut to create a ticket for this specific vehicle -->
                            <a th:href="@{/tickets/new(vehicleId=${vehicle.id})}" class="btn btn-sm btn-outline-success">Create Ticket</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
