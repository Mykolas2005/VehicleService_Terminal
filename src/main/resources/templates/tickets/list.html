<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Tickets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Vehicle Service Management</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/tickets">Tickets</a>
                <a class="nav-link text-danger" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Service Tickets</h2>
            <a th:if="${session.loggedInUser.role.name() == 'CUSTOMER'}" href="/tickets/new" class="btn btn-primary">Create New Ticket</a>
        </div>

        <div th:if="${tickets.empty}" class="alert alert-info">
            No service tickets found.
        </div>

        <div th:if="${!tickets.empty}" class="table-responsive">
            <table class="table table-bordered table-striped bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Vehicle</th>
                        <th>Service Type</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Repair Notes & Timeline</th>
                        <th th:if="${session.loggedInUser.role.name() != 'CUSTOMER'}">Action / Workflow</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td th:text="${ticket.id}">1</td>
                        <td th:text="${ticket.vehicle.make + ' ' + ticket.vehicle.model}">Vehicle</td>
                        <td th:text="${ticket.serviceType}">Oil Change</td>
                        <td th:text="${ticket.description}">Description</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${ticket.status.name() == 'OPEN'} ? 'bg-secondary' : (${ticket.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' : 'bg-success')"
                                  th:text="${ticket.status}">OPEN</span>
                        </td>
                        <td>
                            <div th:if="${ticket.repairNotes != null}" class="mb-1">
                                <strong>Notes:</strong> <span th:text="${ticket.repairNotes}">Notes here</span>
                            </div>
                            <div class="text-muted small">
                                Created: <span th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
                            </div>
                            <div class="text-muted small" th:if="${ticket.updatedAt != null}">
                                Updated: <span th:text="${#temporals.format(ticket.updatedAt, 'yyyy-MM-dd HH:mm')}">Date</span>
                            </div>
                        </td>
                        <td th:if="${session.loggedInUser.role.name() != 'CUSTOMER'}">
                            <form th:action="@{/tickets/{id}/status(id=${ticket.id})}" method="post" class="row g-2">
                                <div class="col-12">
                                    <select name="status" class="form-select form-select-sm">
                                        <option value="OPEN" th:selected="${ticket.status.name() == 'OPEN'}">OPEN</option>
                                        <option value="IN_PROGRESS" th:selected="${ticket.status.name() == 'IN_PROGRESS'}">IN PROGRESS</option>
                                        <option value="COMPLETED" th:selected="${ticket.status.name() == 'COMPLETED'}">COMPLETED</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <input type="text" name="repairNotes" class="form-control form-control-sm" placeholder="Optional repair notes..." th:value="${ticket.repairNotes}">
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-sm btn-outline-primary w-100">Update</button>
                                </div>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
