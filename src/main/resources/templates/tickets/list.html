<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Tickets</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { display: inline-block; padding: 8px 12px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background-color: #0056b3; }
        .nav-links { margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>Service Tickets</h2>
    <div class="nav-links">
        <a href="/tickets/new" class="btn">Create New Ticket</a>
        <a href="/" style="margin-left: 15px;">Back to Dashboard</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Vehicle</th>
                <th>Service Type</th>
                <th>Description</th>
                <th>Status</th>
                <th>Created Date</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}">1</td>
                <td th:text="${ticket.vehicle.make + ' ' + ticket.vehicle.model + ' (' + ticket.vehicle.registrationNumber + ')'}">Ford Focus (AB12 CDE)</td>
                <td th:text="${ticket.serviceType}">Repair</td>
                <td th:text="${ticket.description}">Engine making clicking sound</td>
                <td th:text="${ticket.status}">OPEN</td>
                <td th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-07 10:00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(tickets)}">
                <td colspan="6">No service tickets found.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
