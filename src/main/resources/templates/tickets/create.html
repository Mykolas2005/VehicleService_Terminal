<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Service Ticket</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select, textarea { width: 100%; max-width: 500px; padding: 8px; box-sizing: border-box; }
        textarea { height: 100px; }
        .btn { padding: 8px 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #218838; }
        .cancel-link { margin-left: 10px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>
    <h2>Create New Service Ticket</h2>

    <form th:action="@{/tickets/new}" method="post">
        <div class="form-group">
            <label for="vehicleId">Select Vehicle:</label>
            <select id="vehicleId" name="vehicleId" required>
                <option value="" disabled selected>-- Select a Vehicle --</option>
                <option th:each="vehicle : ${vehicles}" 
                        th:value="${vehicle.id}" 
                        th:text="${vehicle.make + ' ' + vehicle.model + ' (' + vehicle.registrationNumber + ')'}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="serviceType">Service Type / Fault Category:</label>
            <select id="serviceType" name="serviceType" required>
                <option value="" disabled selected>-- Select Type --</option>
                <option value="Annual Inspection">Annual Inspection</option>
                <option value="Oil & Filter Change">Oil & Filter Change</option>
                <option value="Brake Service">Brake Service</option>
                <option value="Engine Diagnostics">Engine Diagnostics</option>
                <option value="General Fault / Repair">General Fault / Repair</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Detailed Description of Issue:</label>
            <textarea id="description" name="description" placeholder="Describe the issue or requested maintenance..." required></textarea>
        </div>

        <div>
            <button type="submit" class="btn">Submit Ticket</button>
            <a href="/tickets" class="cancel-link">Cancel</a>
        </div>
    </form>
</body>
</html>
