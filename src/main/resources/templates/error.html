<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-danger shadow-sm">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">System Error Encountered</h4>
                    </div>
                    <div class="card-body">
                        <p class="lead text-dark" th:text="${errorMessage}">An unexpected error occurred in the system.</p>
                        
                        <div class="alert alert-warning" th:if="${errorDetails}">
                            <small><strong>Technical details:</strong> <span th:text="${errorDetails}">Error message details</span></small>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <a href="/" class="btn btn-primary">Return to Dashboard</a>
                            <button onclick="history.back()" class="btn btn-outline-secondary">Go Back</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
