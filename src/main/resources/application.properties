
# DATABASE CONNECTION (H2 File-based for Persistence - US7)
spring.datasource.url=jdbc:h2:file:./data/vehicleservicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# 'update' tells Hibernate to create tables if missing, but keep the data!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# WEB & THYMELEAF SETTINGS
spring.thymeleaf.cache=false
server.forward-headers-strategy=framework